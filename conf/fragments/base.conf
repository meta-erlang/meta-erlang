BB_CONF_FRAGMENT_SUMMARY = "This fragment sets a limit of 4 bitbake threads and 4 parsing threads"
BB_CONF_FRAGMENT_DESCRIPTION = "This fragment is useful to constrain resource consumption when the Yocto default \
is causing an overload of host machine's memory and CPU resources."

# only use specific version for erlang and elixir.
# Version values may use '%' (or '*') as a trailing wildcard, e.g. "29%".
BBMASK:append = " ${@'/erlang_(?!' + __import__('re').escape(d.getVar('ERLANG_VERSION')).replace('\\*', '.*').replace('%', '.*') + ')[^/]*\.bb$'}"
BBMASK:append = " ${@'/elixir_(?!' + __import__('re').escape(d.getVar('ELIXIR_VERSION')).replace('\\*', '.*').replace('%', '.*') + ')[^/]*\.bb$'}"

USER_CLASSES ?= "buildhistory buildstats"
BUILDHISTORY_COMMIT = "1"

PACKAGE_CLASSES = "package_ipk"

INHERIT += "rm_work"
RM_WORK_EXCLUDE = "elixir elixir-native nativesdk-elixir erlang erlang-native nativesdk-erlang"