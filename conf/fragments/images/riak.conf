BB_CONF_FRAGMENT_SUMMARY = "This fragment sets configuration need for building and running riak image with meta-erlang"
BB_CONF_FRAGMENT_DESCRIPTION = "This fragment sets configuration need for building and running riak image with meta-erlang. \
    It is used to set the erlang and elixir versions to be used in the image."

ERLANG_VERSION = "26%"
ELIXIR_VERSION = "1.15%"

IMAGE_ROOTFS_EXTRA_SPACE = "256000"
DISTRO_FEATURES:append = " pam"
QB_MEM ?= "-m 1024"