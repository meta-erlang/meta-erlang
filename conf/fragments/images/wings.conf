BB_CONF_FRAGMENT_SUMMARY = "This fragment sets configuration need for building and running wings image with meta-erlang"
BB_CONF_FRAGMENT_DESCRIPTION = "This fragment sets configuration need for building and running wings image with meta-erlang. \
    It is used to set the erlang and elixir versions to be used in the image."

ERLANG_VERSION = "29%"
ELIXIR_VERSION = "1.20%"

# wings requires erlang-wx
PACKAGECONFIG:append:pn-erlang = " wx"
PACKAGECONFIG:append:pn-erlang-native = " wx"

DISTRO_FEATURES:append = " opencl"
