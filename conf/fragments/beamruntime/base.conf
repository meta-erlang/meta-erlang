BB_CONF_FRAGMENT_SUMMARY = "This fragment sets basic configuration for building beamruntime and Erlang/OTP."
BB_CONF_FRAGMENT_DESCRIPTION = "This fragment sets basic configuration for building beamruntime and Erlang/OTP. \
    It is used to set the versions of Erlang and Elixir to be built, and to remove opengl support when building beamruntime."

ERLANG_VERSION = "29%"
ELIXIR_VERSION = "1.20%"

# Remove opengl support when building beamruntime,
# that makes Erlang wx dependencies to be disabled.
DISTRO_FEATURES_FILTER_NATIVESDK:remove = "opengl"
